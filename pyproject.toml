[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kannaka-quantum"
version = "0.2.10"
description = "Real quantum + qBraid Lab infrastructure capabilities for Kannaka via qBraid (free simulator) and OpenQuantum (real QPUs) — a CLI bridge for the coding agent and an MCP server for any agent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["quantum", "qbraid", "openquantum", "kannaka", "mcp", "agent", "qiskit", "compute", "lab"]
dependencies = [
    # qBraid's unreleased 0.13 flips measurement bitstrings to little-endian across
    # providers (CHANGELOG "Unreleased", 2026-09). core._measured_index encodes the
    # per-device convention this bridge verified on real devices; under 0.13 the
    # entropy harvest and the recall argmax would silently invert. Ceiling until that
    # is audited; the bench's bit-order canary is the tripwire.
    "qbraid>=0.12,<0.13",
    # The core line qbraid 0.12.x resolves (it requires <0.4). The server-side cost
    # estimate `_qbraid_quote` asks for lives in qbraid-core 0.6.x, which arrives
    # with qbraid 0.13 and its bit-order flip: the two upgrade together, behind the
    # canary. Until then the quote is absent and the guard treats that as unknown.
    "qbraid-core>=0.3.3,<0.4",
    "qiskit>=1.0",
    "numpy>=1.23",
    "mcp>=1.0",
    "openquantum-sdk>=0.3",
]

[project.optional-dependencies]
# qBraid environment/kernel tools import the environments service, which pulls
# in Jupyter's kernelspec manager. Compute/credit/profile tools do NOT need it.
lab = ["jupyter-client>=8"]
# Lint + test only — nothing heavyweight. This is what CI installs.
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.urls]
Homepage = "https://github.com/NickFlach/kannaka-quantum"

[project.scripts]
kannaka-quantum = "kannaka_quantum.cli:main"

[tool.setuptools.packages.find]
include = ["kannaka_quantum*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
